<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ITC - Download</title>
  <meta name="description" content="Download the ITC app. Latest APK versions.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <div class="container">
      <div class="hero-label">android release server</div>
      <h1 id="appName"></h1>
      <p class="tagline" id="tagline"></p>

      <div class="term">
        <div class="term-bar">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
          <span class="term-title">itc@releases: ~/apks</span>
        </div>
        <div class="term-body">
          <div class="line"><span class="prompt">$</span> itc --check-update --latest</div>
          <div class="out" id="termOutput"></div>
          <div class="line"><span class="prompt">$</span><span class="cursor"></span></div>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <span class="stat-value" id="statVersions">0</span>
          <span class="stat-label">RELEASES</span>
        </div>
        <div class="stat">
          <span class="stat-value" id="statDownloads">0</span>
          <span class="stat-label">DOWNLOADS</span>
        </div>
        <div class="stat">
          <span class="stat-value"><span class="pulse"></span>online</span>
          <span class="stat-label">SERVER</span>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="error" class="error hidden"></div>
    <div id="list"></div>
    <p id="empty" class="empty hidden"><span class="prompt">$</span> find releases --latest<br>no releases found. check back soon.</p>
  </main>

  <footer class="footer">
    <div class="container" id="footerText"></div>
    <div class="container" style="margin-top:8px;"><a class="admin-link" href="admin.html">admin_console</a></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const supabase = window.supabase.createClient(APP_URL, APP_ANON_KEY);
    const appId = new URLSearchParams(location.search).get("app") || "itc";
    const appMeta = APPS.find(a => a.id === appId) || APPS[0];
    document.title = appMeta.name + " - Download";
    document.getElementById("appName").textContent = appMeta.name;
    document.getElementById("tagline").innerHTML = appMeta.id + "://" + appMeta.id + " <b>v2.1.0</b> \u00B7 direct apk distribution";
    document.getElementById("footerText").innerHTML = "<span class=\"ok\">\u25A0</span> " + appMeta.id + "_release_server \u00B7 all systems operational \u00B7 " + new Date().getFullYear();

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      const units = ["KB", "MB", "GB"];
      let value = bytes;
      let unit = "B";
      for (const u of units) {
        value = value / 1024;
        unit = u;
        if (value < 1024) break;
      }
      return value.toFixed(value >= 100 ? 0 : 1) + " " + unit;
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleDateString(undefined, {
        year: "numeric", month: "short", day: "numeric"
      });
    }

    function card(v, isLatest) {
      const el = document.createElement("div");
      el.className = "card";
      el.innerHTML = `
        <div class="term-bar">
          <span class="dot r"></span><span class="dot y"></span><span class="dot g"></span>
          <span class="term-title">~/releases/</span>
        </div>
        <div class="card-body">
          <div class="v-line">
            <span class="v-label">release</span>
            <span class="v-number"></span>
            ${isLatest ? `<span class="tag-latest">LATEST</span>` : ""}
          </div>
          <div class="meta">
            <div><span class="prompt">$</span> ls -la release.apk</div>
            <div id="metaLine"></div>
          </div>
          ${v.notes ? `<div class="notes"></div>` : ""}
          <div class="download-row">
            <span class="dl-count"><b id="dlCount"></b> downloads</span>
            <a class="btn" href="#" download></a>
          </div>
        </div>`;
      el.querySelector(".term-title").textContent = "~/releases/" + v.file_name;
      el.querySelector(".v-number").textContent = "v" + v.version_name;
      let meta = v.file_name + " \u00B7 " + formatSize(v.file_size) + " \u00B7 " + formatDate(v.created_at);
      if (v.version_code !== null && v.version_code !== undefined) {
        meta += " \u00B7 code " + v.version_code;
      }
      el.querySelector("#metaLine").textContent = meta;
      if (v.notes) el.querySelector(".notes").textContent = "$ " + appId + " changelog --release v" + v.version_name + "\n" + v.notes;
      el.querySelector("#dlCount").textContent = v.download_count.toLocaleString();
      const link = el.querySelector(".btn");
      link.href = SITE_URL + encodeURIComponent(v.storage_path);
      link.setAttribute("download", v.file_name);
      link.textContent = "\u25B8 download apk";
      link.addEventListener("click", function () {
        supabase.rpc("increment_download", { p_id: v.id });
        v.download_count += 1;
        el.querySelector("#dlCount").textContent = v.download_count.toLocaleString();
      });
      return el;
    }

    async function load() {
      const { data, error } = await supabase
        .from("apk_versions")
        .select("*")
        .eq("app", appId)
        .order("created_at", { ascending: false });
      if (error) {
        document.getElementById("error").textContent = "connection error: " + error.message;
        document.getElementById("error").classList.remove("hidden");
        return;
      }
      document.getElementById("statVersions").textContent = data.length;
      document.getElementById("statDownloads").textContent = data.reduce((s, v) => s + (v.download_count || 0), 0).toLocaleString();
      const latest = data[0];
      document.getElementById("termOutput").innerHTML = latest
        ? "> latest build: <span class=\"hl\">v" + latest.version_name + "</span> \u00B7 " + data.length + " release(s) online \u00B7 " + formatSize(latest.file_size)
        : "> no releases online yet \u00B7 awaiting first build";
      const list = document.getElementById("list");
      list.innerHTML = "";
      document.getElementById("empty").classList.toggle("hidden", data.length > 0);
      data.forEach((v, i) => list.appendChild(card(v, i === 0)));
    }

    load();
  </script>
</body>
</html>
